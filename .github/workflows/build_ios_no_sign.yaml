name: ios-build-no-sign

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/**"
    paths:
      - ".github/workflows/build_ios_no_sign.yaml"
      - "simple_live_app/**"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          cache: true

      - name: Restore packages
        working-directory: simple_live_app
        run: flutter pub get

      - name: Build iOS
        working-directory: simple_live_app
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=GIT_COMMIT=${{ github.sha }}

      - name: Create unsigned IPA
        working-directory: simple_live_app/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          zip -q -r ios_no_sign.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-no-sign
          path: simple_live_app/build/ios/iphoneos/ios_no_sign.ipa
          if-no-files-found: error
