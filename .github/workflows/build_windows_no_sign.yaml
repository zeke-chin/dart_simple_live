name: windows-build-no-sign

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/**"
    paths:
      - ".github/workflows/build_windows_no_sign.yaml"
      - "simple_live_app/**"
      - "simple_live_core/**"

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Restore packages
        working-directory: simple_live_app
        run: flutter pub get

      - name: Build Windows
        working-directory: simple_live_app
        run: >-
          flutter build windows --release
          --dart-define=GIT_COMMIT=${{ github.sha }}

      - name: Create unsigned Windows ZIP
        shell: pwsh
        working-directory: simple_live_app
        run: |
          $releaseDirectory = "build\windows\x64\runner\Release"
          $artifactPath = "build\windows\x64\windows_no_sign.zip"

          if (-not (Test-Path $releaseDirectory)) {
            throw "Windows release directory not found: $releaseDirectory"
          }

          Compress-Archive `
            -Path "$releaseDirectory\*" `
            -DestinationPath $artifactPath `
            -Force

      - name: Upload unsigned Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-no-sign
          path: simple_live_app/build/windows/x64/windows_no_sign.zip
          if-no-files-found: error
