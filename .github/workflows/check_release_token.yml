# 只验证 secrets.TOKEN 能否创建 GitHub Release，不构建。
name: check-release-token

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Probe TOKEN
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "actor=$(gh api user --jq .login)"
          id="$(gh api "repos/${GH_REPO}/releases" \
            -f tag_name=token-probe-delete-me \
            -f name=token-probe-delete-me \
            -f body=ci-token-probe \
            -F draft=true \
            --jq .id)"
          echo "created draft id=${id}"
          gh api "repos/${GH_REPO}/releases/${id}" -X DELETE
          gh api "repos/${GH_REPO}/git/refs/tags/token-probe-delete-me" -X DELETE || true
          echo "TOKEN can create GitHub Releases"
